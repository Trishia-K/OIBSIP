<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app-card">
        <header class="app-header">
            <div class="header-bg-image"></div>
            <div class="header-content">
                <h1>Temperature Converter</h1>
            </div>
        </header>

        <form id="converter-form" novalidate>
            <div class="input-group">
                <label for="temp-input">Temperature Value</label>
                <div class="input-wrapper">
                    <input type="number" id="temp-input" placeholder="e.g. 25" step="any" required>
                    <select id="unit-select">
                        <option value="C">Celsius (°C)</option>
                        <option value="F">Fahrenheit (°F)</option>
                        <option value="K">Kelvin (K)</option>
                    </select>
                </div>
                <span id="error-message" class="error-msg" role="alert"></span>
            </div>

            <button type="button" id="convert-btn">Convert Temperature</button>
        </form>

        <section class="results-container">
            <h2>Converted Values</h2>
            <div id="results-grid" class="results-grid">
                </div>
        </section>

        <div id="temp-status-card" class="status-card">
            <span id="temp-status-text" class="status-text">Enter a value to see state</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
